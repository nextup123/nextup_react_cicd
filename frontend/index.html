<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/nextup_logo.png" />
    <title>NextUp Robot Console</title>
    <!-- Theme before first paint (same rules as src/lib/theme.js). -->
    <script>
      (function () {
        var t = {};
        try { t = JSON.parse(localStorage.getItem("nextup.theme") || "{}") || {}; } catch (e) {}
        var m = t.mode || "light";
        if (m === "auto") m = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-mode", m);
        document.documentElement.setAttribute("data-accent", t.accent || "indigo");
      })();
    </script>
    <style>
      html[data-mode="gray"] { background: #cfd3d9; }
      html[data-mode="dark"] { background: #0e1014; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
